# Релиз по тегу v*: тесты → typecheck → DMG arm64 → GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macos-14 — раннер на Apple Silicon: DMG собирается на целевой архитектуре.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Build DMG (unsigned)
        run: npm run dist
        env:
          # Подписи нет намеренно — не дать electron-builder искать сертификаты.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
