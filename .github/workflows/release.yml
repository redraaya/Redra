# Релиз по тегу v*: тесты → typecheck → DMG arm64 → GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macos-14 — раннер на Apple Silicon: DMG собирается на целевой архитектуре.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Тег релиза обязан совпадать с версией в package.json — иначе DMG
      # с «чужой» версией уедет в релиз под неверным тегом.
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run smoke

      - name: Build DMG (unsigned)
        run: npm run dist
        env:
          # Подписи нет намеренно — не дать electron-builder искать сертификаты.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
