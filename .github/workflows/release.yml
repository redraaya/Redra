# Release on a v* tag: tests → typecheck → arm64 DMG → GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macos-14 is an Apple Silicon runner: the DMG is built on the target architecture.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The release tag must match the version in package.json — otherwise a DMG
      # with a "foreign" version would ship in a release under the wrong tag.
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run smoke

      - name: Build DMG (unsigned)
        run: npm run dist
        env:
          # Deliberately unsigned — stop electron-builder from looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
