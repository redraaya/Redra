# CI на каждый push/PR в main. macos-14 (Apple Silicon) — сознательно:
# smoke-прогон запускает настоящее окно Electron, macOS-раннеры это умеют
# без виртуального дисплея. Если smoke окажется нестабильным на раннерах,
# его можно вынести в отдельный необязательный job — пока не потребовалось.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run smoke
