# CI on every push/PR to main. macos-14 (Apple Silicon) is deliberate:
# the smoke run opens a real Electron window, and macOS runners can do that
# without a virtual display. If smoke ever turns flaky on the runners, it can
# be moved into a separate optional job — hasn't been needed so far.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run smoke
