<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Redra</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="start">
    <header id="titlebar">
      <div id="doc-title">
        <span id="title-app">Redra</span>
        <span id="title-doc" hidden>
          <span id="doc-name"></span>
          <span id="dirty-dot" hidden title="Есть несохранённые изменения"></span>
        </span>
      </div>
      <div id="tb-actions">
        <span id="update-pill" hidden title="Вышла новая версия — открыть страницу загрузки">
          <span id="update-text"></span>
          <button id="update-close" type="button" title="Скрыть" aria-label="Скрыть">✕</button>
        </span>
        <span id="mode-pill" hidden>Просмотр</span>
        <button class="tb-btn doc-only" id="btn-preview" type="button" title="Просмотр (⌘E)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
            <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
          </svg>
        </button>
        <button class="tb-btn doc-only" id="btn-pdf" type="button" title="Экспорт в PDF… (⇧⌘E)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3v4a1 1 0 0 0 1 1h4" />
            <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
            <path d="M12 11v6" />
            <path d="M9.5 14.5l2.5 2.5l2.5 -2.5" />
          </svg>
        </button>
        <button class="tb-btn doc-only" id="btn-save" type="button" title="Сохранить (⌘S)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" />
            <path d="M10 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
            <path d="M14 4v4h-6v-4" />
          </svg>
        </button>
        <button class="tb-btn" id="btn-theme" type="button" title="Тема: системная">
          <svg id="theme-icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
            <path d="M12 3v18" />
            <path d="M12 9l4.65 -4.65" />
            <path d="M12 14.3l7.37 -7.37" />
            <path d="M12 19.6l8.85 -8.85" />
          </svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M8 12a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
            <path d="M12 3v2" /><path d="M12 19v2" /><path d="M3 12h2" /><path d="M19 12h2" />
            <path d="M5.6 5.6l1.4 1.4" /><path d="M17 17l1.4 1.4" />
            <path d="M18.4 5.6l-1.4 1.4" /><path d="M7 17l-1.4 1.4" />
          </svg>
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
          </svg>
        </button>
      </div>
    </header>

    <main id="start">
      <div class="glyph"><div class="bar"></div></div>
      <div class="wordmark">Redra</div>
      <div class="tagline">Откройте HTML-файл. Кликните в текст. Пишите.</div>
      <div class="drop" id="drop-pill">Перетащите файл сюда — или <b>⌘O</b></div>
      <div class="recent" id="recent-block" hidden>
        <div class="recent-label">Недавние</div>
        <div id="recents"></div>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
