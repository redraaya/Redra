# Сборка дистрибутива Redra: DMG для Apple Silicon (arm64), без подписи.
# Подпись/нотаризация сознательно отключены (identity: null) — для запуска
# скачанного приложения нужен правый клик → «Открыть» (см. README).
appId: app.redra.redra
productName: Redra

directories:
  output: dist
  buildResources: build

# electron-vite кладёт скомпилированный код в out/; production-зависимостей
# нет (движок собран в бандл), так что node_modules в пакет не попадает.
files:
  - out/**
  - package.json

npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  artifactName: Redra-${version}-arm64.dmg
  extendInfo:
    # Ассоциация с HTML как РЕДАКТОР (роль Editor): Redra появляется в
    # Finder → «Открыть в…» для .html/.htm, не перехватывая их по умолчанию
    # (LSHandlerRank: Alternate — браузер остаётся обработчиком по умолчанию).
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.html
        CFBundleTypeExtensions:
          - html
          - htm

dmg:
  # Классическая раскладка: приложение слева, симлинк на /Applications справа.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
