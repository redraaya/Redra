# Redra distribution build: a DMG for Apple Silicon (arm64), unsigned.
# Signing/notarization is deliberately off (identity: null) — the first launch
# of the downloaded app is unblocked via System Settings →
# Privacy & Security → "Open Anyway" (see README).
appId: app.redra.redra
productName: Redra

# No auto-updates — without publish: null electron-builder puts
# app-update.yml / latest-mac.yml into the package, and nothing uses them.
publish: null

directories:
  output: dist
  buildResources: build

# electron-vite puts the compiled code into out/; there are no production
# dependencies (the engine is bundled), so node_modules never enters the package.
files:
  - out/**
  - package.json

npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  artifactName: Redra-${version}-arm64.dmg
  extendInfo:
    # HTML association as an EDITOR (Editor role): Redra appears in
    # Finder → "Open With…" for .html/.htm without hijacking them by default
    # (LSHandlerRank: Alternate — the browser stays the default handler).
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.html
        CFBundleTypeExtensions:
          - html
          - htm
      - CFBundleTypeName: Markdown document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - net.daringfireball.markdown
        CFBundleTypeExtensions:
          - md
          - markdown
          - mdown
          - mkd

dmg:
  # Classic layout: the app on the left, a symlink to /Applications on the right.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
afterPack: scripts/adhoc-sign.cjs
