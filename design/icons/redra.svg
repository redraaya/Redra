<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Redra app icon — "two bars" (author's design, approved 2026-08-02).
       Apple Big Sur icon grid: the visible squircle is 824×824 centered on
       a TRANSPARENT 1024 canvas (margins 100px each side), corner radius
       ≈185 — so the Dock size matches neighboring apps.
       Glyph: two top-aligned vertical bars — a full-height stem and a
       half-height arm, gap ≈ one bar width (a minimal lowercase "r").
       Geometry comes from the author's 788×788 SVG mapped onto the 824
       squircle: scale 824/788, offset +100. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#D9482B"/>
  <g fill="#EBEBEB">
    <rect x="278.64" y="184.96" width="161.21" height="664.45"/>
    <rect x="597.74" y="184.96" width="161.21" height="326.78"/>
  </g>
</svg>
